# 本项目专用 PostgreSQL（与宿主机/其他容器 5432 错开端口）
name: user-login-admin

services:
  redis:
    image: redis:7-alpine
    container_name: user-login-admin-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: user-login-admin-db
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev_password
      POSTGRES_DB: user_login_admin
    volumes:
      - user_login_admin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d user_login_admin"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  user_login_admin_pgdata:
